changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: New
      labels:
        - enhancement
    - title: Fixed
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - dependencies
        - chore
    - title: Other changes
      labels:
        - "*"
